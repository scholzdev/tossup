# Builds the wiki (tools/build_wiki.sh) and publishes it with GitHub Pages on every push to main.
# One-time setup: repository Settings > Pages > Source: GitHub Actions.
name: wiki

# Only wiki inputs trigger a build: the game data (content, locales, game.lua for the constants and the route), the art the wiki
# copies, the docs and the generator. Changes elsewhere in src/ do not. "Run workflow" in the Actions tab builds on demand.
on:
  push:
    branches: [main]
    paths:
      - content/**
      - locales/**
      - src/game.lua
      - assets/coins/**
      - assets/items/**
      - assets/relics/**
      - assets/characters/**
      - assets/ui/logo.png
      - assets/ui/icon.png
      - assets/fonts/**
      - tools/gen_wiki.py
      - tools/dump_content.lua
      - tools/build_wiki.sh
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          sudo ln -sf /usr/bin/lua5.1 /usr/local/bin/lua
          pip install pillow
      - name: Build the wiki
        run: ./tools/build_wiki.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
