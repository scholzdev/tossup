# Builds the wiki (tools/build_wiki.sh) and publishes it with GitHub Pages on every push to main.
# One-time setup: repository Settings > Pages > Source: GitHub Actions.
name: wiki

# Only wiki inputs trigger a build: the game data (content, locales, game.lua for the constants and the route), the art the wiki
# copies, the docs and the generator. Changes elsewhere in src/ do not. "Run workflow" in the Actions tab builds on demand.
on:
  push:
    branches: [main]
    paths:
      - content/**
      - locales/**
      - src/game.lua
      - assets/coins/**
      - assets/items/**
      - assets/relics/**
      - assets/characters/**
      - assets/ui/logo.png
      - assets/ui/icon.png
      - assets/fonts/**
      - tools/gen_wiki.py
      - tools/wiki_guide.py
      - tools/gen_github_wiki.py
      - tools/dump_content.lua
      - tools/build_wiki.sh
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          sudo ln -sf /usr/bin/lua5.1 /usr/local/bin/lua
          pip install pillow
      - name: Build the wiki
        run: ./tools/build_wiki.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki
      - uses: actions/upload-artifact@v4
        with:
          name: github-wiki
          path: wiki-github

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish-wiki:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-wiki
          path: generated-wiki
      - name: Publish GitHub Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
        run: |
          if ! git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" live-wiki; then
            echo 'Initialize the Wiki once with a Home page in the GitHub UI, then rerun this workflow.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path

          generated = {p.name for p in Path('generated-wiki').glob('*.md')}
          marker = '<!-- Generated by tools/gen_github_wiki.py; edit the game data instead. -->'
          for path in Path('live-wiki').glob('*.md'):
              if path.name not in generated and path.read_text(encoding='utf-8').startswith(marker):
                  path.unlink()
          PY
          cp generated-wiki/*.md live-wiki/
          cd live-wiki
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- '*.md'
          if ! git diff --cached --quiet; then
            git commit -m 'docs: regenerate game wiki'
            git push
          fi
