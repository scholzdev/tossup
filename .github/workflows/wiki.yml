# Builds the wiki (tools/build_wiki.sh) and publishes it with GitHub Pages on every push to main.
# One-time setup: repository Settings > Pages > Source: GitHub Actions.
name: wiki

# Wiki inputs include Unity rules/content, resource art/locales, docs and generators.
# "Run workflow" in the Actions tab builds on demand.
on:
  push:
    branches: [main]
    paths:
      - Assets/Scripts/Core/**
      - Assets/Scripts/Content/**
      - Assets/Resources/**
      - Tools/game/**
      - Tools/game_tools.sh
      - Tools/gen_*.py
      - Tools/wiki_guide.py
      - Tools/build_wiki.sh
      - docs/**
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Pillow
        run: pip install pillow
      - name: Build the wiki
        run: ./Tools/build_wiki.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki
      - uses: actions/upload-artifact@v4
        with:
          name: github-wiki
          path: wiki-github

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish-wiki:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-wiki
          path: generated-wiki
      - name: Publish GitHub Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
        run: |
          if ! git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" live-wiki; then
            echo 'Initialize the Wiki once with a Home page in the GitHub UI, then rerun this workflow.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path

          generated = {p.name for p in Path('generated-wiki').glob('*.md')}
          marker = '<!-- Generated by tools/gen_github_wiki.py; edit the game data instead. -->'
          for path in Path('live-wiki').glob('*.md'):
              if path.name not in generated and path.read_text(encoding='utf-8').startswith(marker):
                  path.unlink()
          PY
          cp generated-wiki/*.md live-wiki/
          cd live-wiki
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- '*.md'
          if ! git diff --cached --quiet; then
            git commit -m 'docs: regenerate game wiki'
            git push
          fi
